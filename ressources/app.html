<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes vols</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230071e3%22/%3E%3Cpath d=%22M14 38l36-14-8 22-7-7-6 6v-8z%22 fill=%22white%22/%3E%3C/svg%3E">
<style>
/* Mes vols : une fenêtre façon app Apple. Voyages à gauche, le voyage choisi à droite, le prix d'abord.
   Polices du système (San Francisco sur Mac, Segoe UI Variable sur Windows), aucun fichier externe. */
:root{
  --bg:#f5f5f7; --side:rgba(236,236,240,.82); --surface:#ffffff; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#a1a1a6; --sep:rgba(60,60,67,.14);
  --accent:#0071e3; --accent-text:#0066cc; --accent-soft:rgba(0,113,227,.1);
  --green:#1f8a3b; --green-soft:rgba(52,199,89,.14); --orange:#b25000; --orange-soft:rgba(255,149,0,.14); --red:#d70015;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
  --sheet-shadow:0 24px 80px rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --side:rgba(28,28,30,.86); --surface:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --text:#f5f5f7; --text-2:#98989d; --text-3:#636366; --sep:rgba(84,84,88,.6);
  --accent:#0a84ff; --accent-text:#409cff; --accent-soft:rgba(10,132,255,.18);
  --green:#30d158; --green-soft:rgba(48,209,88,.16); --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.16); --red:#ff453a;
  --shadow:none; --sheet-shadow:0 24px 80px rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent-text);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ------------- structure */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}
.side{background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px 20px}
.side-head>div{display:flex;gap:2px}
.side-head h1{font:700 22px/1 var(--font-display);margin:0;letter-spacing:-.02em}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--accent);transition:background .15s}
.icon-btn:hover{background:var(--fill-2)}
.icon-btn svg{width:20px;height:20px}
.search{margin:4px 14px 10px;position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 10px 8px 32px;font-size:14px;outline:none}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--text-2)}
.trips{flex:1;overflow:auto;padding:4px 10px 10px}
.group{font:600 12px var(--font);color:var(--text-2);padding:14px 10px 6px;text-transform:none}
.trip{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:10px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;transition:background .15s}
.trip:hover{background:var(--fill-2)}
.trip[aria-current="true"]{background:var(--accent);color:#fff}
.trip[aria-current="true"] .t-sub,.trip[aria-current="true"] .t-price small{color:rgba(255,255,255,.82)}
.t-route{font:600 14px var(--font);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{grid-column:1;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-price{grid-row:1/3;grid-column:2;text-align:right;font:600 15px var(--font)}
.t-price small{display:block;font-weight:400;font-size:11.5px;color:var(--text-2)}
.trip.off{opacity:.55}
.side-foot{border-top:1px solid var(--sep);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2)}
.side-foot .grow{flex:1;min-width:0}
.side-foot b{display:block;color:var(--text);font-weight:500;font-size:13px}
.side-foot .bar{height:3px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.side-foot .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease)}

.main{overflow:auto;min-width:0;position:relative}
.content{max-width:880px;margin:0 auto;padding:34px 40px 64px;display:grid;gap:28px}
.content>*{min-width:0}

/* ------------- en-tête du voyage */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h2{font:700 34px/1.08 var(--font-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--text-2);max-width:60ch}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:980px;padding:8px 16px;font-weight:500;font-size:14px;background:var(--fill);color:var(--text);display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--fill) 100%,var(--text) 6%)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.link{background:transparent;color:var(--accent-text);padding:8px 10px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.back{display:none}

/* ------------- meilleur prix */
.hero{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);overflow:hidden}
.hero-price{padding:28px 28px 26px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--sep)}
.eyebrow{font-size:13px;font-weight:600;color:var(--text-2)}
.big{font:700 60px/1 var(--font-display);letter-spacing:-.035em;margin:6px 0 2px}
.big small{font-size:.5em;font-weight:600;margin-left:4px;letter-spacing:-.01em}
.muted{color:var(--text-2);font-size:13.5px}
.hero-price .btn{align-self:flex-start;margin-top:auto}
.hero-flight{padding:28px;display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px}
.leg .pt{display:grid;gap:2px}
.leg .pt.end{text-align:right}
.leg .time{font:600 26px/1 var(--font-display);letter-spacing:-.02em}
.leg .time sup{font-size:12px;font-weight:600;color:var(--orange);margin-left:2px;vertical-align:top}
.leg .code{font-size:13px;color:var(--text-2);font-weight:500}
.track{position:relative;height:28px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--sep)}
.track .dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text-3);transform:translate(-50%,-50%)}
.track .lab{position:absolute;top:-9px;transform:translateX(-50%);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.track .d{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:12px;color:var(--text-2);white-space:nowrap;background:var(--surface);padding:0 6px}
.leg-title{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:980px;background:var(--fill-2);color:var(--text-2)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.orange{background:var(--orange-soft);color:var(--orange)}

.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.alt{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;color:var(--text);transition:transform .15s var(--ease)}
.alt:hover{transform:translateY(-1px)}
.alt .eyebrow{grid-column:1/-1;margin-bottom:4px}
.alt b{font-weight:600}
.alt .p{grid-row:2/4;grid-column:2;font:600 22px var(--font-display);letter-spacing:-.02em}

/* ------------- liste des vols */
.section h3{font:700 22px/1.2 var(--font-display);letter-spacing:-.02em;margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--text);transition:color .2s}
.seg button small{display:block;font-size:11.5px;font-weight:400;color:var(--text-2)}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .35s var(--ease),width .35s var(--ease)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);cursor:pointer;user-select:none}
.switch{position:relative;width:38px;height:23px;border-radius:980px;background:var(--fill);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
input:checked+.switch{background:var(--green)}
input:checked+.switch::after{transform:translateX(15px)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle input:focus-visible+.switch{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}
select.plain{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:13.5px}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{border-bottom:1px solid var(--sep)}
.row:last-child{border-bottom:0}
.row.off{opacity:.55}
.row-main{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:150px 70px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 18px;transition:background .15s}
.row-main:hover{background:var(--fill-2)}
.r-time{font-weight:600;font-size:15px;white-space:nowrap}
.r-time sup{font-size:10.5px;color:var(--orange);margin-left:1px}
.r-time .ret{display:block;font-weight:400;color:var(--text-2);font-size:13.5px;margin-top:2px}
.r-dur{font-size:13.5px;color:var(--text-2)}
.r-dur .ret{display:block;margin-top:2px}
.r-info{min-width:0}
.r-info b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-info span{font-size:13px;color:var(--text-2)}
.r-price{text-align:right;font:600 17px var(--font-display);letter-spacing:-.01em}
.r-price small{display:block;font:400 11.5px var(--font);color:var(--text-2)}
.row-more{display:none;padding:0 18px 14px;gap:8px;flex-wrap:wrap}
.row.open .row-more{display:flex}
.offer{display:flex;gap:14px;align-items:center;justify-content:space-between;border-radius:10px;background:var(--fill-2);padding:9px 12px;font-size:13.5px;color:var(--text);min-width:200px;flex:1}
.offer b{font-weight:600}
.offer.best{background:var(--green-soft)}
.empty{padding:40px 20px;text-align:center;color:var(--text-2)}
.fade{animation:monte .45s var(--ease) both}
@keyframes monte{from{opacity:0;transform:translateY(6px)}}

.trend{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend .meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13.5px;color:var(--text-2);margin-bottom:8px}
.trend .meta b{color:var(--text);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills a{font-size:13.5px;padding:7px 13px;border-radius:980px;background:var(--fill-2);color:var(--text)}
.pills a:hover{background:var(--fill)}

/* ------------- états vides */
.blank{min-height:calc(100vh - 40px);display:grid;place-items:center;text-align:center;padding:40px}
.blank h2{font:700 40px/1.08 var(--font-display);letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance}
.blank p{color:var(--text-2);font-size:17px;margin:0 auto 26px;max-width:44ch}
.blank .btn{font-size:16px;padding:11px 22px}
.steps{display:flex;gap:28px;justify-content:center;margin-top:44px;color:var(--text-2);font-size:13.5px;flex-wrap:wrap}
.steps div{max-width:160px}
.steps b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}
.waiting{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:40px;text-align:center;display:grid;gap:12px;justify-items:center}
.waiting h3{font:600 22px var(--font-display);margin:0}
.waiting .bar{width:min(320px,100%);height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.waiting .bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--ease)}

/* ------------- feuilles (création, réglages, confirmation) */
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:100vw;max-height:100vh}
dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
.sheet{width:min(580px,calc(100vw - 32px));max-height:min(860px,calc(100vh - 48px));background:var(--bg);border-radius:18px;box-shadow:var(--sheet-shadow);display:flex;flex-direction:column;overflow:hidden}
dialog[open] .sheet{animation:feuille .42s var(--ease)}
@keyframes feuille{from{transform:translateY(24px) scale(.98);opacity:0}}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px;border-bottom:1px solid var(--sep);background:var(--surface)}
.sheet-head h3{margin:0;font:600 15px var(--font);text-align:center}
.sheet-head .btn{justify-self:start}
.sheet-head .btn:last-child{justify-self:end}
.sheet-body{overflow:auto;padding:18px 18px 26px;display:grid;gap:22px}
.summary{font-size:15px;line-height:1.5;color:var(--text-2);padding:0 4px}
.summary b{color:var(--text);font-weight:600}
.grp-title{font-size:13px;color:var(--text-2);padding:0 16px 6px;text-transform:uppercase;letter-spacing:.02em}
.grp{background:var(--surface);border-radius:12px;overflow:visible}
.cell{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:46px;padding:6px 16px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.cell label,.cell .lab{flex:none;font-size:15px}
.cell .hint{display:block;font-size:12.5px;color:var(--text-2)}
.cell input[type=text],.cell input[type=number],.cell input[type=date],.cell select{border:0;background:transparent;text-align:right;outline:none;min-width:0;flex:1;font-size:15px;padding:8px 0;color:var(--text)}
.cell input::placeholder{color:var(--text-3)}
.cell select{appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--accent-text);text-align-last:right}
.cell.col{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px}
.cell .seg{align-self:stretch;display:flex}
.cell .seg button{flex:1}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:transparent;width:36px;height:30px;font-size:18px;color:var(--text)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:24px;text-align:center;font-weight:600}
.err-txt{color:var(--red);font-size:13px;padding:6px 16px 0}
.route-cell{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.swap{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--accent-text);display:grid;place-items:center;margin-right:12px}
.swap svg{width:16px;height:16px;transform:rotate(90deg)}
.city{position:relative;flex:1;display:flex;justify-content:flex-end;min-width:0}
.city input{text-align:right}
.city .sel{color:var(--text-2);font-size:13px;margin-left:8px;white-space:nowrap;align-self:center}
.suggest{position:absolute;right:-8px;top:calc(100% + 4px);width:min(320px,80vw);background:var(--surface);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px var(--sep);padding:6px;z-index:5;max-height:280px;overflow:auto}
.suggest button{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.suggest button small{color:var(--text-2)}
.suggest button[aria-selected="true"]{background:var(--accent);color:#fff}
.suggest button[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.foot-note{font-size:12.5px;color:var(--text-2);padding:6px 16px 0}
.alert{width:min(320px,calc(100vw - 48px));background:var(--surface);border-radius:16px;box-shadow:var(--sheet-shadow);padding:22px 20px 16px;text-align:center}
.alert h3{margin:0 0 6px;font:600 17px var(--font)}
.alert p{margin:0 0 18px;color:var(--text-2);font-size:14px}
.alert .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alert .btn{justify-content:center}
.menu{position:absolute;z-index:20;background:var(--surface);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px var(--sep);padding:6px;min-width:220px}
.menu button,.menu a{display:flex;width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--text)}
.menu button:hover,.menu a:hover{background:var(--accent);color:#fff}
.menu .danger{color:var(--red)}
.menu hr{border:0;height:1px;background:var(--sep);margin:4px 6px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:14px;font-weight:500;transition:.35s var(--ease);pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ------------- petit écran : la liste, puis le détail (comme sur iPhone) */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0}
  .app.detail .side{display:none}
  .app:not(.detail) .main{display:none}
  .content{padding:18px 16px 48px;gap:22px}
  .back{display:inline-flex}
  .head h2{font-size:28px}
  .hero{grid-template-columns:1fr}
  .hero-price{border-right:0;border-bottom:1px solid var(--sep);padding:22px}
  .hero-flight{padding:22px}
  .big{font-size:50px}
  .row-main{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .r-time{grid-column:1}
  .r-dur{display:none}
  .r-info{grid-column:1}
  .r-price{grid-row:1/3;grid-column:2}
  .sheet{width:100vw;max-height:calc(100vh - 20px);border-radius:16px 16px 0 0;align-self:end}
  dialog.bottom{margin:auto 0 0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Mes voyages">
    <div class="side-head">
      <h1>Mes vols</h1>
      <div>
        <button class="icon-btn" id="b-reglages" title="Réglages" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="icon-btn" id="b-nouveau" title="Nouveau voyage (Ctrl+N)" aria-label="Nouveau voyage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Rechercher" aria-label="Rechercher un voyage"></label>
    <nav class="trips" id="trips"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="d-edit" class="bottom"><form class="sheet" id="f-edit" novalidate></form></dialog>
<dialog id="d-reglages" class="bottom"><div class="sheet" id="s-reglages"></div></dialog>
<dialog id="d-confirm"><div class="alert" id="s-confirm"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => Math.round(n).toLocaleString("fr-FR") + " €";
const dur = m => `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`;
const jour = (d, o={weekday:"short", day:"numeric", month:"short"}) => new Date(d+"T12:00:00").toLocaleDateString("fr-FR", o);
const auj = () => new Date().toISOString().slice(0,10);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CLASSES = {eco:"Économique", premium:"Premium", affaires:"Affaires", premiere:"Première"};
const ICONE_PLUS = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

let D = null, sel = null, VOY = {}, FILTRE = {}, enCours = false, pollT = null;

/* ------------------------------------------------------------ outils */
async function api(chemin, corps){
  const opt = corps === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Mes-Vols":"1"}, body:JSON.stringify(corps)};
  const r = await fetch(chemin, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.erreur || "L'application ne répond pas."), {details:j.details, status:r.status});
  return j;
}
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }
function compter(el, vers){
  /* le prix « compte » jusqu'à sa valeur, en ralentissant à l'arrivée */
  const de = +(el.dataset.v || Math.round(vers * .82)); el.dataset.v = vers;
  if (REDUIT || de === vers) { el.firstChild.textContent = Math.round(vers).toLocaleString("fr-FR"); return; }
  const t0 = performance.now(), T = 850;
  const pas = t => { const k = Math.min(1, (t - t0) / T), e = 1 - Math.pow(2, -10 * k);
    el.firstChild.textContent = Math.round(de + (vers - de) * (k === 1 ? 1 : e)).toLocaleString("fr-FR");
    if (k < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}
function segmente(conteneur, onChoix){
  /* contrôle segmenté avec un curseur qui glisse sous le choix */
  let thumb = conteneur.querySelector(".thumb");
  if (!thumb) { thumb = document.createElement("span"); thumb.className = "thumb"; conteneur.prepend(thumb); }
  const placer = (anim=true) => { const b = conteneur.querySelector('[aria-pressed="true"]'); if (!b) { thumb.style.width = 0; return; }
    if (!anim) thumb.style.transition = "none";
    thumb.style.left = b.offsetLeft + "px"; thumb.style.width = b.offsetWidth + "px";
    if (!anim) requestAnimationFrame(() => thumb.style.transition = ""); };
  conteneur.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    conteneur.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); placer(); onChoix(b.dataset.v); }));
  requestAnimationFrame(() => placer(false));
}
const nPass = p => p.adultes + p.enfants + p.bebes;
function phrase(p){
  const o = p.origine.nom || p.origine.code, d = p.destination.nom || p.destination.code;
  if (!o || !d) return "Choisissez le départ et l'arrivée.";
  const pass = [`${p.adultes} adulte${p.adultes>1?"s":""}`, p.enfants ? `${p.enfants} enfant${p.enfants>1?"s":""}` : "", p.bebes ? `${p.bebes} bébé${p.bebes>1?"s":""}` : ""].filter(Boolean).join(", ");
  const dates = p.date_aller ? (p.type === "ar" && p.date_retour ? `du ${jour(p.date_aller,{day:"numeric",month:"long"})} au ${jour(p.date_retour,{day:"numeric",month:"long"})}` : `le ${jour(p.date_aller,{weekday:"long",day:"numeric",month:"long"})}`) : "";
  const pref = [+p.flex ? `à ${p.flex} jour${p.flex>1?"s":""} près` : "", p.escales === "direct" ? "en direct" : p.escales === "1" ? "avec 1 escale au plus" : "", p.duree_max_h ? `en moins de ${p.duree_max_h} h` : ""].filter(Boolean).join(", ");
  return `<b>${esc(o)} → ${esc(d)}</b>, ${p.type === "ar" ? "aller-retour" : "aller simple"} ${dates}${pref ? ", " + pref : ""}. ${esc(pass)}, classe ${CLASSES[p.classe].toLowerCase()}.`;
}

/* ------------------------------------------------------------ données */
async function charger(){
  D = await api("/api/donnees");
  const ids = D.projets.map(p => p.id);
  const voulu = decodeURIComponent(location.hash.slice(1));
  if (!sel || !ids.includes(sel)) sel = ids.includes(voulu) ? voulu : (D.projets.find(p => p.actif) || D.projets[0] || {}).id || null;
  dessinerListe(); dessinerPied(); await afficher(sel, false);
  if (D.statut.en_cours) suivre();
}
async function voyage(id, frais=false){
  if (!id) return null;
  if (!frais && VOY[id] !== undefined) return VOY[id];
  try { VOY[id] = await api("/api/voyage/" + encodeURIComponent(id)); } catch (e) { VOY[id] = null; }
  if (VOY[id] && VOY[id].vide) VOY[id] = null;
  return VOY[id];
}

/* ------------------------------------------------------------ colonne de gauche */
function dessinerListe(){
  const q = norm($("#q").value);
  const vis = D.projets.filter(p => !q || norm(`${p.nom} ${p.origine.nom} ${p.destination.nom} ${p.origine.code} ${p.destination.code}`).includes(q));
  const item = p => { const r = D.resumes[p.id] || {}, m = r.meilleur;
    return `<button class="trip${p.actif ? "" : " off"}" data-id="${esc(p.id)}" aria-current="${p.id === sel}">
      <span class="t-route">${esc(p.origine.code)} ${p.type === "ar" ? "⇄" : "→"} ${esc(p.destination.code)}</span>
      <span class="t-sub">${esc(p.nom)} · ${esc(jour(p.date_aller,{day:"numeric",month:"short"}))}</span>
      <span class="t-price">${m ? eur(m.prix) : ""}<small>${m ? "par pers." : (p.actif ? "à rechercher" : "")}</small></span>
    </button>`; };
  const actifs = vis.filter(p => p.actif), arch = vis.filter(p => !p.actif);
  $("#trips").innerHTML = (actifs.length ? actifs.map(item).join("") : (q ? '<p class="group">Aucun voyage trouvé.</p>' : "")) +
    (arch.length ? '<div class="group">Archivés</div>' + arch.map(item).join("") : "");
  $("#trips").querySelectorAll(".trip").forEach(b => b.onclick = () => afficher(b.dataset.id));
}
function dessinerPied(prog){
  const a = D.reglages.app;
  let html;
  if (enCours || D.statut.en_cours) {
    const pr = prog || D.statut.progression, pc = pr && pr.total ? Math.round(100 * pr.fait / pr.total) : 5;
    html = `<span class="spin" style="color:var(--accent)"></span><div class="grow"><b>Recherche des prix…</b>${pr ? esc(pr.texte) + ` · ${pr.fait + 1} sur ${pr.total}` : "Démarrage"}<div class="bar"><i style="width:${pc}%"></i></div></div>`;
  } else if (a.navigateur_prepa) {
    html = `<span class="spin" style="color:var(--accent)"></span><div class="grow"><b>Préparation</b>Téléchargement du navigateur de recherche (une seule fois).</div>`;
  } else if (!D.reglages.programmee) {
    html = `<div class="grow"><b>Recherche automatique inactive</b>Ouvrez les réglages pour l'activer.</div>`;
  } else {
    html = `<div class="grow"><b>Prix mis à jour chaque jour</b>Prochaine recherche à 9 h, ou au démarrage de l'ordinateur.</div>`;
  }
  $("#foot").innerHTML = html;
}

/* ------------------------------------------------------------ partie droite */
async function afficher(id, anime=true){
  sel = id;
  if (id) history.replaceState(null, "", "#" + encodeURIComponent(id));
  dessinerListe();
  const main = $("#main");
  if (!D.projets.length) {
    $("#app").classList.remove("detail");
    main.innerHTML = `<div class="blank fade"><div>
      <h2>Suivez le prix de vos vols</h2>
      <p>Indiquez votre trajet et vos dates. Mes vols compare les prix chaque jour et vous prévient quand ils baissent.</p>
      <button class="btn primary" id="b-premier">${ICONE_PLUS} Créer mon premier voyage</button>
      <div class="steps"><div><b>1. Votre trajet</b>Villes, dates, voyageurs.</div><div><b>2. Chaque jour</b>Kayak et Momondo sont comparés.</div><div><b>3. Une alerte</b>Quand le prix vous plaît.</div></div>
    </div></div>`;
    $("#b-premier").onclick = () => editer(null);
    return;
  }
  const p = D.projets.find(x => x.id === id);
  if (!p) return;
  $("#app").classList.add("detail");
  const v = await voyage(id);
  if (sel !== id) return;
  main.innerHTML = `<div class="content${anime ? " fade" : ""}">${entete(p)}${v ? corps(p, v) : attente(p)}</div>`;
  main.scrollTop = 0;
  brancher(p, v);
}
function entete(p){
  const actif = enCours || D.statut.en_cours;
  return `<header class="head">
    <div style="min-width:0">
      <button class="btn link back" id="b-retour">‹ Voyages</button>
      <h2>${esc(p.nom)}</h2>
      <p>${phrase(p)}</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="b-chercher" ${actif ? "disabled" : ""}>${actif ? '<span class="spin"></span> Recherche…' : "Rechercher"}</button>
      <button class="btn" id="b-modifier">Modifier</button>
      <button class="btn" id="b-plus" aria-label="Plus d'actions" aria-haspopup="menu">•••</button>
    </div>
  </header>`;
}
function attente(p){
  const actif = enCours || D.statut.en_cours, pr = D.statut.progression;
  const passe = p.date_aller < auj();
  return `<section class="waiting">
    <h3>${passe ? "Ce voyage est passé" : actif ? "Recherche en cours" : "Pas encore de prix"}</h3>
    <p class="muted">${passe ? "Les dates sont passées : modifiez-les pour relancer le suivi." : actif ? "Kayak et Momondo sont consultés, comptez une à trois minutes par date." : "Lancez une première recherche, elle prend quelques minutes."}</p>
    ${actif ? `<div class="bar"><i style="width:${pr && pr.total ? Math.round(100*pr.fait/pr.total) : 5}%"></i></div>` : passe ? "" : '<button class="btn primary" id="b-chercher2">Rechercher maintenant</button>'}
  </section>`;
}
const direct = v => v.escales === 0 && !(v.retour && v.retour.escales);
const minBy = (a, f) => a.reduce((x, y) => f(y) < f(x) ? y : x);
function tempsHTML(t){ const [h, plus] = String(t).split(" "); return esc(h) + (plus ? `<sup>${esc(plus)}</sup>` : ""); }
function legHTML(t){
  const [a, b] = t.aeroports.split("-");
  const st = (t.via || "").split(",").map(s => s.trim()).filter(Boolean);
  return `<div class="leg">
    <div class="pt"><span class="time">${tempsHTML(t.depart)}</span><span class="code">${esc(a)}</span></div>
    <div class="track">${st.map((s,i) => { const x = (i+1)/(st.length+1)*100; return `<span class="dot" style="left:${x}%"></span><span class="lab" style="left:${x}%">${esc(s)}</span>`; }).join("")}<span class="d">${dur(t.duree)}${st.length ? "" : " · direct"}</span></div>
    <div class="pt end"><span class="time">${tempsHTML(t.arrivee)}</span><span class="code">${esc(b)}</span></div>
  </div>`;
}
function badges(v, ligne=false){
  return [direct(v) && !ligne ? '<span class="chip green">Direct</span>' : "",
    v.depart < "05:00" ? '<span class="chip orange">Part la nuit précédente</span>' : "",
    v.autonome ? '<span class="chip orange">Billets séparés</span>' : ""].join("");
}
function corps(p, V){
  const ok = V.vols.filter(v => v.ok);
  const f = FILTRE[p.id] || (FILTRE[p.id] = {date: [...new Set(V.vols.map(v => v.date))].includes(p.date_aller) ? p.date_aller : "tous", direct:false, hors:false, tri:"prix"});
  let hero = `<section class="waiting"><h3>Aucun vol ne respecte encore vos critères</h3><p class="muted">Élargissez la durée ou les escales dans « Modifier », ou affichez les vols hors critères plus bas.</p></section>`, alts = "";
  if (ok.length) {
    const c = minBy(ok, v => v.prix);
    hero = `<section class="hero">
      <div class="hero-price">
        <span class="eyebrow">Meilleur prix aujourd'hui</span>
        <div class="big num" id="prix-big" data-v=""><span>${Math.round(c.prix).toLocaleString("fr-FR")}</span><small>€</small></div>
        <span class="muted">${V.projet.passagers > 1 ? `par personne, ${eur(c.prix_total)} pour ${V.projet.passagers}` : "par personne"} · sur ${esc(c.source)}</span>
        <a class="btn primary" href="${esc(c.lien)}" target="_blank" rel="noopener">Voir l'offre ↗</a>
      </div>
      <div class="hero-flight">
        ${c.retour ? `<span class="leg-title">Aller · ${esc(jour(c.date,{weekday:"long",day:"numeric",month:"long"}))}</span>` : `<span class="leg-title">${esc(jour(c.date,{weekday:"long",day:"numeric",month:"long"}))}</span>`}
        ${legHTML(c)}
        ${c.retour ? `<span class="leg-title">Retour · ${esc(jour(c.retour.date,{weekday:"long",day:"numeric",month:"long"}))}</span>${legHTML(c.retour)}` : ""}
        <div class="chips"><span class="chip">${esc(c.compagnie)}</span>${c.escale_detail ? `<span class="chip">Escale ${esc(c.escale_detail)}</span>` : ""}${badges(c)}</div>
      </div>
    </section>`;
    const val = v => v.prix + ((v.duree + (v.retour ? v.retour.duree : 0)) / 60) * 25;
    const courts = ok.filter(v => v !== c && !direct(v) && v.duree < c.duree), dirs = ok.filter(direct);
    const a = [];
    if (courts.length) a.push(["Plus court avec escale", minBy(courts, val)]);
    if (dirs.length && !direct(c)) a.push(["Le moins cher en direct", minBy(dirs, v => v.prix)]);
    if (a.length) alts = `<div class="alts">${a.map(([lab, v]) => `<a class="alt" href="${esc(v.lien)}" target="_blank" rel="noopener">
      <span class="eyebrow">${lab}</span><b>${esc(v.compagnie)}</b><span class="p">${eur(v.prix)}</span>
      <span class="muted">${esc(jour(v.date))} · ${esc(v.depart)} · ${dur(v.duree)}${v.escales ? " · " + esc(v.via) : ""}</span></a>`).join("")}</div>`;
  }
  const dates = [...new Set(V.vols.map(v => v.date))].sort();
  const desDe = d => { const a = ok.filter(v => d === "tous" || v.date === d); return a.length ? "dès " + eur(minBy(a, v => v.prix).prix) : "aucun"; };
  const seg = dates.length > 1 ? `<div class="seg" id="seg-dates" role="group" aria-label="Jour de départ">${[...dates, "tous"].map(d => `<button type="button" data-v="${d}" aria-pressed="${d === f.date}">${d === "tous" ? "Tous" : esc(jour(d))}<small>${desDe(d)}</small></button>`).join("")}</div>` : "";
  const H = (V.histo || []).map(h => ({...h, best: Math.min(...[h.escale, h.direct].filter(Boolean).map(x => x[0]))})).filter(h => isFinite(h.best));
  return `${hero}${alts}
    <section class="section">
      <h3>Tous les vols</h3>
      <div class="tools">${seg}
        <label class="toggle"><input type="checkbox" id="t-direct" ${f.direct ? "checked" : ""}><span class="switch"></span>Directs</label>
        <label class="toggle"><input type="checkbox" id="t-hors" ${f.hors ? "checked" : ""}><span class="switch"></span>Hors critères</label>
        <select class="plain" id="t-tri" aria-label="Trier"><option value="prix">Par prix</option><option value="duree">Par durée</option><option value="depart">Par heure</option></select>
      </div>
      <div class="list" id="liste-vols"></div>
    </section>
    ${H.length >= 2 ? `<section class="section"><h3>Évolution du prix</h3><div class="trend" id="trend"></div></section>` : ""}
    <section class="section">
      <h3>Vérifier sur les sites</h3>
      <div class="pills">${V.liens.map(([n,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}<a href="/excel/${encodeURIComponent(p.id)}">Exporter en Excel</a></div>
      <p class="muted" style="margin-top:14px">Relevé du ${esc(V.releve.replace(" ", " à "))} sur ${esc(V.sources)}. Prix par personne, taxes comprises, bagage en soute pas toujours inclus.</p>
    </section>`;
}
function ligneVol(v, i, p){
  const r = v.retour, n = p ? nPass(p) : 1;
  const obs = [...v.obs].sort((a,b) => a.prix - b.prix);
  return `<div class="row${v.ok ? "" : " off"}${REDUIT ? "" : " fade"}" style="animation-delay:${Math.min(i,12)*22}ms">
    <button class="row-main" aria-expanded="false">
      <span class="r-time">${tempsHTML(v.depart)} → ${tempsHTML(v.arrivee)}${r ? `<span class="ret">${tempsHTML(r.depart)} → ${tempsHTML(r.arrivee)}</span>` : ""}</span>
      <span class="r-dur">${dur(v.duree)}${r ? `<span class="ret">${dur(r.duree)}</span>` : ""}</span>
      <span class="r-info"><b>${esc(v.compagnie)}</b><span>${esc(jour(v.date))} · ${v.escales ? `${v.escales} escale${v.escales>1?"s":""} à ${esc(v.via)}` : "direct"}${r ? ` · retour ${r.escales ? "via " + esc(r.via) : "direct"}` : ""}</span> <span class="chips" style="display:inline-flex;margin-left:4px">${badges(v, true)}</span></span>
      <span class="r-price">${eur(v.prix)}${n > 1 ? `<small>${eur(v.prix_total)} au total</small>` : ""}</span>
    </button>
    <div class="row-more">${obs.map((o, k) => `<a class="offer${k === 0 && obs.length > 1 ? " best" : ""}" href="${esc(o.lien)}" target="_blank" rel="noopener"><span>${esc(o.source)} ↗</span><b>${eur(o.prix)}</b></a>`).join("")}</div>
  </div>`;
}
function dessinerVols(p, V){
  const f = FILTRE[p.id];
  const r = V.vols.filter(v => (f.date === "tous" || v.date === f.date) && (f.hors || v.ok) && (!f.direct || direct(v)));
  const k = {prix: v => v.prix, duree: v => v.duree, depart: v => v.date + v.depart}[f.tri];
  r.sort((a,b) => (k(a) > k(b)) - (k(a) < k(b)) || a.prix - b.prix);
  const el = $("#liste-vols");
  el.innerHTML = r.length ? r.map((v,i) => ligneVol(v, i, p)).join("") : '<div class="empty">Aucun vol avec ces filtres.</div>';
  el.querySelectorAll(".row-main").forEach(b => b.onclick = () => { const row = b.parentElement; row.classList.toggle("open"); b.setAttribute("aria-expanded", row.classList.contains("open")); });
}
function dessinerTendance(V){
  const el = $("#trend"); if (!el) return;
  const H = (V.histo || []).map(h => ({...h, best: Math.min(...[h.escale, h.direct].filter(Boolean).map(x => x[0]))})).filter(h => isFinite(h.best));
  const W = 640, Ht = 140, P = {l:4, r:4, t:24, b:22};
  const ys = H.map(h => h.best), lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(10, (hi - lo) * .25);
  const y = v => P.t + (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad))) * (Ht - P.t - P.b);
  const x = i => P.l + i * (W - P.l - P.r) / (H.length - 1);
  const pts = H.map((h, i) => [x(i), y(h.best)]);
  const ligne = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");

      <div class="cell"><span class="lab">Dossier</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left">${esc(R.dossier)}</span></div>
    </div><p class="foot-note">Vos voyages et l'historique des prix restent sur cet ordinateur. Rien n'est envoyé ailleurs.</p></div>
  </div>`;
  const d = $("#d-reglages");
  $("#r-notif").onchange = async e => { await api("/api/reglages", {notifications: e.target.checked}); R.notifications = e.target.checked; };
  $("#r-test").onclick = async () => { try { await api("/api/test-notif", {}); toast("Notification envoyée"); } catch (e) { toast("Les notifications sont bloquées par le système"); } };
  const eff = $("#r-eff"); if (eff) eff.onclick = async e => { e.preventDefault(); await api("/api/reglages", {effacer_serpapi: true}); R.serpapi = false; reglages(); toast("Clé retirée"); };
  $("#r-ok").onclick = async () => { const c = $("#r-cle").value.trim(); if (c) { const r = await api("/api/reglages", {serpapi_cle: c}); R.serpapi = r.serpapi; toast("Clé enregistrée"); } d.close(); };
  if (!d.open) d.showModal();
}

/* ------------------------------------------------------------ démarrage */
$("#b-nouveau").onclick = () => editer(null);
$("#b-reglages").onclick = () => reglages();
$("#q").addEventListener("input", dessinerListe);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n") { e.preventDefault(); editer(null); }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && $("#d-edit").open) { e.preventDefault(); $("#f-edit").requestSubmit(); }
  if (e.key === "Escape") fermerMenu();
});
window.addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== sel && D.projets.some(p => p.id === id)) afficher(id); });
charger().catch(() => { $("#main").innerHTML = '<div class="blank"><div><h2>L’application ne répond pas</h2><p>Fermez cette page et relancez Mes vols.</p></div></div>'; });
</script>
</body>
</html>
