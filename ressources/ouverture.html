<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes vols</title>
<style>
:root{--bg:#f5f5f7;--text:#1d1d1f;--text-2:#6e6e73;--accent:#0071e3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--text:#f5f5f7;--text-2:#98989d;--accent:#0a84ff;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:grid;place-items:center}
.b{display:grid;justify-items:center;gap:18px;animation:in .5s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:scale(.96)}}
.i{width:72px;height:72px;border-radius:17px;background:linear-gradient(#0a84ff,#0060df);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,113,227,.3)}
.i svg{width:40px;height:40px}
h1{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--text-2)}
.s{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="b">
  <div class="i"><svg viewBox="0 0 64 64"><path d="M15 33 49 19 27 37Z" fill="#fff"/><path d="M27 37 49 19 40 46Z" fill="#e8f0ff"/><path d="M27 37 30 46 33 40.5Z" fill="#c8dafa"/></svg></div>
  <h1>Ouverture de Mes vols</h1>
  <div class="s" role="status" aria-label="Chargement"></div>
  <p id="m">Quelques secondes…</p>
</div>
<script>
const url = "__URL__", t0 = Date.now();
(function essai(){
  fetch(url + "api/ping", {mode: "no-cors", cache: "no-store"})
    .then(() => location.replace(url))
    .catch(() => {
      if (Date.now() - t0 > 30000) document.getElementById("m").textContent = "C'est plus long que prévu. Si rien ne se passe, relancez Mes vols.";
      setTimeout(essai, 400);
    });
})();
</script>
</body>
</html>
