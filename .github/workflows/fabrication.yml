name: Fabrication

# Fabrique l'application pour Windows, Mac (puce Apple) et Mac (Intel).
# Une étiquette vX.Y.Z publie en plus une version téléchargeable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: macos-14
            nom: Mac-Apple
          - os: macos-15-intel
            nom: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller playwright openpyxl certifi pillow pywebview

      - name: Icônes
        run: python outils/icone.py --icns

      - name: Application
        run: pyinstaller Trackflight.spec --noconfirm

      - name: Vérification (lancement sans interface)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist/Trackflight/Trackflight.exe"; else EXE="dist/Trackflight.app/Contents/MacOS/Trackflight"; fi
          TRACKFLIGHT_DONNEES="$RUNNER_TEMP/mv" "$EXE" --desinstaller
          test -d "$RUNNER_TEMP/mv" && echo "L'application démarre."

      - name: Installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TRACKFLIGHT_VERSION = (Get-Content VERSION).Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installateur\Trackflight.iss

      - name: Image disque Mac
        if: runner.os == 'macOS'
        run: |
          mkdir -p sortie dmg
          cp -R "dist/Trackflight.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Trackflight" -srcfolder dmg -ov -format UDZO "sortie/Trackflight-${{ matrix.nom }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Trackflight-${{ matrix.nom }}
          path: sortie/*

  publier:
    needs: fabriquer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Trackflight ${{ github.ref_name }}
          body_path: NOTES_VERSION.md
          files: sortie/*
