name: Fabrication

# Fabrique l'application pour Windows, Mac (puce Apple) et Mac (Intel).
# Une étiquette vX.Y.Z publie en plus une version téléchargeable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: macos-15
            nom: Mac-Apple
          - os: macos-15-intel
            nom: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller playwright openpyxl certifi pillow pywebview pycryptodome==4.6.0

      - name: Icônes
        run: python outils/icone.py --icns

      - name: Application
        run: pyinstaller Trackflight.spec --noconfirm

      - name: Vérification (lancement sans interface)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist/Trackflight/Trackflight.exe"; else EXE="dist/Trackflight.app/Contents/MacOS/Trackflight"; fi
          TRACKFLIGHT_DONNEES="$RUNNER_TEMP/mv" "$EXE" --desinstaller
          test -d "$RUNNER_TEMP/mv" && echo "L'application démarre."

      - name: Compatibilité macOS (aucun fichier ne doit exiger plus que macOS 11)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Le pilote Playwright (node) n'est utilisé que pour télécharger Chromium : il est exclu du contrôle.
          trop=0
          while IFS= read -r f; do
            v=$(vtool -show-build "$f" 2>/dev/null | awk '/minos/{print $2; exit}')
            [ -z "$v" ] && continue
            if [ "$(printf '%s\n11.0\n' "$v" | sort -V | tail -1)" != "11.0" ]; then echo "Exige macOS $v : $f"; trop=1; fi
          done < <(find dist/Trackflight.app/Contents -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -not -path '*/playwright/driver/*')
          [ $trop -eq 0 ] && echo "Tous les fichiers fonctionnent dès macOS 11." || exit 1

      - name: Installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TRACKFLIGHT_VERSION = (Get-Content VERSION).Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installateur\Trackflight.iss

      - name: Image disque Mac
        if: runner.os == 'macOS'
        run: |
          mkdir -p sortie dmg
          cp -R "dist/Trackflight.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Trackflight" -srcfolder dmg -ov -format UDZO "sortie/Trackflight-${{ matrix.nom }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Trackflight-${{ matrix.nom }}
          path: sortie/*

  publier:
    needs: fabriquer
    # publie même si une version manque (ex. Mac Apple faute de machine) : elle s'ajoutera en relançant le job
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Trackflight ${{ github.ref_name }}
          body_path: NOTES_VERSION.md
          files: sortie/*
